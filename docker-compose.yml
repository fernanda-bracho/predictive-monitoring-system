services:
  ml-service:
    build:
      context: ./ml_service
    container_name: ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped

  java-service:
    build:
      context: ./java-service
    container_name: java-service
    ports:
      - "8080:8080"
    depends_on:
      - ml-service
    environment:
      - ML_SERVICE_URL=http://ml-service:8000/predict
    restart: unless-stopped